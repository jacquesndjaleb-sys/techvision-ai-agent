name: TechVision AI Agent

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 16 * * *"

  workflow_dispatch:

# Une seule exécution à la fois, pour éviter les conflits sur l'historique.
concurrency:
  group: techvision-agent
  cancel-in-progress: false

# contents: write permet d'enregistrer data/history.json après chaque exécution.
permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exécuter TechVision AI Agent
        run: node index.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
          FACEBOOK_AUTO_PUBLISH: ${{ secrets.FACEBOOK_AUTO_PUBLISH }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

      - name: Enregistrer l'historique des articles traités
        if: success()
        run: |
          git config user.name "techvision-agent[bot]"
          git config user.email "techvision-agent@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "Historique inchangé."
          else
            git commit -m "chore: mise à jour de l'historique des publications"
            git push
          fi

      - name: Conserver la publication et l'image générées
        if: always() && hashFiles('publication.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: publication-techvision
          path: |
            publication.md
            publication-image.*
          retention-days: 7
