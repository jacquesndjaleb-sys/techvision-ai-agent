name: TechVision AI Agent

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 16 * * *"

  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exécuter TechVision AI Agent
        run: node index.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
          FACEBOOK_AUTO_PUBLISH: ${{ secrets.FACEBOOK_AUTO_PUBLISH }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

      - name: Conserver la publication générée
        if: always() && hashFiles('publication.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: publication-techvision
          path: publication.md
          retention-days: 7
